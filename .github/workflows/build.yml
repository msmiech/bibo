name: Build

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'Screenshots/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'Screenshots/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The code must be formatted like the pre-commit hook does it (.pre-commit-config.yaml, .clang-format)
  format:
    name: Code format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Check the format
        run: pipx run pre-commit==4.7.0 run --all-files --show-diff-on-failure --color always

  # The names, using-directives and using-declarations follow the Google C++ style, no mistakes that compile (.clang-tidy)
  tidy:
    name: Code style (clang-tidy)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang cmake ninja-build pkg-config \
            libgl-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libwayland-dev libxkbcommon-dev wayland-protocols
          pipx install clang-tidy==23.1.3

      # Debug: the code that only exists without NDEBUG is checked too. Only configured, the compile commands are enough.
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_C_COMPILER=clang
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DCMAKE_CXX_SCAN_FOR_MODULES=OFF

      - name: Run clang-tidy
        run: git ls-files 'BIBO/*.cpp' 'tests/*.cpp' | xargs -P "$(nproc)" -n 1 clang-tidy -p build --quiet

  linux:
    name: Ubuntu (${{ matrix.name }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC
            cc: gcc
            cxx: g++
            system_libs: 'OFF'
          - name: Clang
            cc: clang
            cxx: clang++
            system_libs: 'OFF'
          - name: GCC, system libraries
            cc: gcc
            cxx: g++
            system_libs: 'ON'
          # Memory errors, leaks and undefined behavior make the tests (and the smoke test) fail
          - name: GCC, AddressSanitizer + UndefinedBehaviorSanitizer
            cc: gcc
            cxx: g++
            system_libs: 'OFF'
            build_type: RelWithDebInfo
            sanitize: -fsanitize=address,undefined -fno-omit-frame-pointer
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      # Initial compiler and linker flags of CMake (empty without sanitizers)
      CFLAGS: ${{ matrix.sanitize }}
      CXXFLAGS: ${{ matrix.sanitize }}
      LDFLAGS: ${{ matrix.sanitize }}
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang cmake ninja-build pkg-config \
            libgl-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libwayland-dev libxkbcommon-dev wayland-protocols \
            xvfb xauth libgl1-mesa-dri
          if [ "${{ matrix.system_libs }}" = "ON" ]; then
            sudo apt-get install -y --no-install-recommends \
              libglfw3-dev libglm-dev libassimp-dev libfreetype-dev libglew-dev
          fi

      # Warnings in the code of the game and of the tests are errors (not on Windows: MSYS2 always has the newest compilers,
      # whose new warnings would break the build without a change of the code)
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.build_type || 'Release' }}
          -DBIBO_USE_SYSTEM_LIBS=${{ matrix.system_libs }} -DBIBO_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build --parallel

      # The tests that need OpenGL 4.3 run on the virtual X server with Mesa's software renderer as well
      - name: Test
        run: xvfb-run -a -s "-screen 0 1280x720x24" ctest --test-dir build --output-on-failure --timeout 300

      # Plays a short demo (main menu, a few steps, pause menu, quit) on a virtual X server with Mesa's software renderer
      # (llvmpipe, OpenGL 4.5). Catches shaders that only compile on the lenient Nvidia driver, missing assets, crashes,
      # a game that hangs and, with the sanitizers, memory errors and leaks up to the clean up at the end.
      - name: Smoke test (software OpenGL)
        env:
          SMOKE_TIMEOUT: 900 # seconds; with the sanitizers loading and every frame take much longer
        run: xvfb-run -a -s "-screen 0 1280x720x24" bash tools/smoke_test.sh build

  windows:
    name: Windows MSYS2 (${{ matrix.name }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: UCRT64 GCC
            msystem: UCRT64
            system_libs: 'OFF'
          - name: CLANG64 Clang
            msystem: CLANG64
            system_libs: 'OFF'
          - name: UCRT64 GCC, system libraries
            msystem: UCRT64
            system_libs: 'ON'
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7

      - uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          pacboy: >-
            toolchain:p
            cmake:p
            ninja:p
            ${{ matrix.system_libs == 'ON' && 'glfw:p glm:p assimp:p freetype:p glew:p' || '' }}

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBIBO_USE_SYSTEM_LIBS=${{ matrix.system_libs }}

      - name: Build
        run: cmake --build build --parallel

      # The runners have no graphics card: the tests that need OpenGL 4.3 are skipped
      - name: Test
        run: ctest --test-dir build --output-on-failure --timeout 300

      # With the downloaded libraries the game is linked statically and must run without MinGW/compiler runtime DLLs
      - name: Check that BIBO.exe only depends on Windows DLLs
        if: matrix.system_libs == 'OFF'
        run: |
          objdump=$(command -v objdump || command -v llvm-objdump)
          "$objdump" -p build/BIBO.exe | grep "DLL Name"
          if "$objdump" -p build/BIBO.exe | grep "DLL Name" | grep -iE "lib(stdc\+\+|gcc_s|winpthread|c\+\+|unwind|assimp|freetype|glfw|glew)|glew32|glfw3|zlib1"; then
            echo "::error::BIBO.exe depends on non-system DLLs"
            exit 1
          fi
