# Checks and formats the staged files before every commit, see README.md › Code style.
# Set up once per clone: pre-commit install
repos:
  # Mistakes that are easy to commit: conflict markers, broken workflow files, large files that are not assets of the game
  # (sources of models, recordings, build output), file names that only differ in their case (the same file on Windows)
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-case-conflict
      - id: check-added-large-files
        args: [--maxkb=2048]
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v23.1.3
    hooks:
      - id: clang-format
        types_or: [c++, c]
