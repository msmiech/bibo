name: Release

# Pushing a version tag (e.g. `git tag 2.0 && git push origin 2.0`) builds the game for Windows and Linux
# and publishes both packages as a GitHub release. Tags with a suffix (2.0-rc1, v2.1-beta) become pre-releases.
on:
  push:
    tags:
      - '[0-9]*'
      - 'v[0-9]*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  linux:
    name: Linux package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            libgl-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libwayland-dev libxkbcommon-dev wayland-protocols \
            xvfb xauth libgl1-mesa-dri

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      # bibo-2.0 for the tags 2.0 and v2.0
      - name: Install into the package folder
        run: |
          package="bibo-${GITHUB_REF_NAME#v}"
          echo "PACKAGE=$package" >> "$GITHUB_ENV"
          cmake --install build --prefix "$package" --strip

      # Starts the game from the package folder (see build.yml), so a package with missing assets is not released
      - name: Smoke test (software OpenGL)
        working-directory: ${{ env.PACKAGE }}
        run: |
          status=0
          xvfb-run -a -s "-screen 0 1280x720x24" timeout 30 ./BIBO 800 600 0 < /dev/null > "$RUNNER_TEMP/smoke.log" 2>&1 || status=$?
          cat "$RUNNER_TEMP/smoke.log"
          # 124: the game was still running when timeout stopped it
          if [ "$status" -ne 124 ]; then
            echo "::error::BIBO exited with code $status"
            exit 1
          fi
          if grep -E "Failed|Could not|ERROR|not complete|below 4.3" "$RUNNER_TEMP/smoke.log"; then
            echo "::error::BIBO reported errors during start up"
            exit 1
          fi

      - name: Archive
        run: tar -czf "$PACKAGE-linux-x64.tar.gz" "$PACKAGE"

      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: ${{ env.PACKAGE }}-linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Windows package
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: zip
          pacboy: >-
            toolchain:p
            cmake:p
            ninja:p

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Check that BIBO.exe only depends on Windows DLLs
        run: |
          objdump -p build/BIBO.exe | grep "DLL Name"
          if objdump -p build/BIBO.exe | grep "DLL Name" | grep -iE "lib(stdc\+\+|gcc_s|winpthread|c\+\+|unwind|assimp|freetype|glfw|glew)|glew32|glfw3|zlib1"; then
            echo "::error::BIBO.exe depends on non-system DLLs"
            exit 1
          fi

      - name: Install into the package folder and archive
        run: |
          package="bibo-${GITHUB_REF_NAME#v}"
          echo "PACKAGE=$package" >> "$GITHUB_ENV"
          cmake --install build --prefix "$package" --strip
          zip -r -9 "$package-windows-x64.zip" "$package"

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: ${{ env.PACKAGE }}-windows-x64.zip
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish release
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create the release and upload the packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -l dist
          if gh release view "$TAG" > /dev/null 2>&1; then
            # The release already exists (re-run of this workflow or created by hand): replace its packages
            gh release upload "$TAG" dist/* --clobber
          else
            flags=()
            if [[ "$TAG" == *-* ]]; then
              flags+=(--prerelease)
            fi
            gh release create "$TAG" dist/* --verify-tag --title "BIBO ${TAG#v}" --generate-notes "${flags[@]}"
          fi
